<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>kd1123 · 美股看盘</title>
<style>
  :root { --bg:#0e1117; --panel:#161b22; --line:#262c36; --text:#e6edf3; --muted:#8b949e; --accent:#2f81f7; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif; }
  header { display:flex; align-items:center; justify-content:space-between; padding:12px 20px; border-bottom:1px solid var(--line); }
  header h1 { font-size:18px; margin:0; letter-spacing:1px; }
  header h1 span { color:var(--accent); }
  #clock { color:var(--muted); font-size:13px; }
  .tape { border-bottom:1px solid var(--line); }
  .bar { display:flex; flex-wrap:wrap; gap:8px; padding:12px 20px; align-items:center; }
  .bar button { background:var(--panel); color:var(--text); border:1px solid var(--line); border-radius:6px; padding:6px 14px; cursor:pointer; font-size:14px; }
  .bar button.active { background:var(--accent); border-color:var(--accent); }
  .bar form { margin-left:auto; display:flex; gap:6px; }
  .bar input { background:var(--panel); border:1px solid var(--line); color:var(--text); border-radius:6px; padding:6px 10px; width:150px; text-transform:uppercase; }
  .grid { display:grid; grid-template-columns: 2.2fr 1fr; gap:12px; padding:0 20px 20px; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:8px; overflow:hidden; }
  .card h2 { font-size:14px; margin:0; padding:10px 14px; border-bottom:1px solid var(--line); color:var(--muted); font-weight:500; }
  #info { height:200px; }
  #chart { height:560px; }
  #quotes { height:520px; }
  #news { height:560px; }
  .left { display:flex; flex-direction:column; gap:12px; }
  .right { display:flex; flex-direction:column; gap:12px; }
  .bar .edit { background:transparent; border-style:dashed; color:var(--muted); }
  .modal { position:fixed; inset:0; background:rgba(0,0,0,.6); display:none; align-items:center; justify-content:center; z-index:99; }
  .modal.open { display:flex; }
  .box { background:var(--panel); border:1px solid var(--line); border-radius:10px; width:min(440px,92vw); padding:18px; }
  .box h3 { margin:0 0 12px; font-size:16px; }
  .box ul { list-style:none; padding:0; margin:0 0 12px; max-height:300px; overflow:auto; }
  .box li { display:flex; align-items:center; justify-content:space-between; padding:6px 4px; border-bottom:1px solid var(--line); font-size:14px; }
  .box li .ops button { background:none; border:none; color:var(--muted); cursor:pointer; font-size:14px; padding:2px 6px; }
  .box li .ops button:hover { color:var(--text); }
  .box .add { display:flex; gap:6px; }
  .box input { flex:1; background:var(--bg); border:1px solid var(--line); color:var(--text); border-radius:6px; padding:6px 8px; min-width:0; }
  .box .btn { background:var(--accent); border:none; color:#fff; border-radius:6px; padding:6px 12px; cursor:pointer; }
  .box .row { display:flex; justify-content:space-between; margin-top:12px; }
  .box .ghost { background:none; border:1px solid var(--line); color:var(--muted); border-radius:6px; padding:6px 12px; cursor:pointer; }
  footer { color:var(--muted); font-size:12px; text-align:center; padding:16px; }
  @media (max-width: 900px) { .grid { grid-template-columns:1fr; } .bar form { margin-left:0; } }
</style>
</head>
<body>
<header>
  <h1><span>kd1123</span> · 美股看盘</h1>
  <div id="clock"></div>
</header>

<div class="tape" id="tape"></div>

<div class="bar" id="bar">
  <form id="search">
    <input id="sym" placeholder="输入代码，如 AMD">
    <button type="submit">查看</button>
  </form>
</div>

<div class="grid">
  <div class="left">
    <div class="card" id="info"></div>
    <div class="card"><h2>K线图</h2><div id="chart"></div></div>
  </div>
  <div class="right">
    <div class="card"><h2>自选行情</h2><div id="quotes"></div></div>
    <div class="card"><h2 id="newsTitle">新闻资讯</h2><div id="news"></div></div>
  </div>
</div>

<div class="modal" id="modal">
  <div class="box">
    <h3>调整自选股</h3>
    <ul id="wl"></ul>
    <div class="add">
      <input id="addSym" placeholder="代码，如 NASDAQ:AMD 或 AMD">
      <input id="addName" placeholder="显示名（可选）">
      <button class="btn" id="addBtn">添加</button>
    </div>
    <div class="row">
      <button class="ghost" id="resetBtn">恢复默认</button>
      <button class="btn" id="doneBtn">完成</button>
    </div>
  </div>
</div>

<footer>行情与新闻由 TradingView 提供，仅供参考，不构成投资建议。</footer>

<script>
  // 自选股：改这里就能增删股票
  const DEFAULT = [
    ["NASDAQ:NVDA","英伟达"], ["NASDAQ:AAPL","苹果"], ["NASDAQ:MSFT","微软"],
    ["NASDAQ:TSLA","特斯拉"], ["NASDAQ:GOOGL","谷歌"], ["NASDAQ:AMZN","亚马逊"],
    ["NASDAQ:META","Meta"], ["NASDAQ:AMD","AMD"], ["NASDAQ:AVGO","博通"], ["NYSE:TSM","台积电"]
  ];
  let WATCH;
  try { WATCH = JSON.parse(localStorage.getItem("kd1123_watch")) || DEFAULT; } catch(e) { WATCH = DEFAULT; }
  if (!Array.isArray(WATCH) || !WATCH.length) WATCH = DEFAULT;
  function save() { localStorage.setItem("kd1123_watch", JSON.stringify(WATCH)); }

  function widget(el, name, cfg) {
    const box = document.getElementById(el);
    box.innerHTML = "";
    const c = document.createElement("div");
    c.className = "tradingview-widget-container";
    c.style.height = "100%";
    const w = document.createElement("div");
    w.className = "tradingview-widget-container__widget";
    w.style.height = "100%";
    c.appendChild(w);
    const s = document.createElement("script");
    s.src = "https://s3.tradingview.com/external-embedding/embed-widget-" + name + ".js";
    s.async = true;
    s.innerHTML = JSON.stringify(cfg);
    c.appendChild(s);
    box.appendChild(c);
  }

  const base = { colorTheme: "dark", isTransparent: true, locale: "zh_CN" };

  function drawLists() {
  widget("tape", "ticker-tape", Object.assign({}, base, {
    symbols: [{proName:"FOREXCOM:SPXUSD",title:"标普500"},{proName:"FOREXCOM:NSXUSD",title:"纳斯达克100"}]
      .concat(WATCH.map(([s,t]) => ({proName:s,title:t}))),
    showSymbolLogo: true, displayMode: "adaptive"
  }));

  widget("quotes", "market-quotes", Object.assign({}, base, {
    width: "100%", height: "100%", showSymbolLogo: true,
    symbolsGroups: [{ name: "自选", symbols: WATCH.map(([s,t]) => ({name:s, displayName:t})) }]
  }));
  }

  function show(sym) {
    current = sym;
    document.querySelectorAll(".bar button[data-s]").forEach(b => b.classList.toggle("active", b.dataset.s === sym));
    widget("info", "symbol-info", Object.assign({}, base, { symbol: sym, width: "100%" }));
    widget("chart", "advanced-chart", Object.assign({}, base, {
      symbol: sym, autosize: true, interval: "D", timezone: "America/New_York",
      theme: "dark", style: "1", allow_symbol_change: true, hide_side_toolbar: false
    }));
    widget("news", "timeline", Object.assign({}, base, {
      feedMode: "symbol", symbol: sym, displayMode: "regular", width: "100%", height: "100%"
    }));
    document.getElementById("newsTitle").textContent = "新闻资讯 · " + sym.split(":").pop();
  }

  const bar = document.getElementById("bar");
  const form = document.getElementById("search");
  let current = null;
  function drawButtons() {
    bar.querySelectorAll("button[data-s], button.edit").forEach(b => b.remove());
    WATCH.forEach(([s,t]) => {
      const b = document.createElement("button");
      b.dataset.s = s;
      b.textContent = t + " " + s.split(":").pop();
      b.onclick = () => show(s);
      bar.insertBefore(b, form);
    });
    const e = document.createElement("button");
    e.className = "edit";
    e.textContent = "✎ 调整自选";
    e.onclick = openModal;
    bar.insertBefore(e, form);
    document.querySelectorAll(".bar button[data-s]").forEach(b => b.classList.toggle("active", b.dataset.s === current));
  }
  function refreshAll() { save(); drawButtons(); drawLists(); }

  const modal = document.getElementById("modal");
  function drawModal() {
    const ul = document.getElementById("wl");
    ul.innerHTML = "";
    WATCH.forEach(([s,t], i) => {
      const li = document.createElement("li");
      li.innerHTML = "<span>" + t + " · " + s + "</span>";
      const ops = document.createElement("span");
      ops.className = "ops";
      [["↑", () => { if (i>0) [WATCH[i-1],WATCH[i]]=[WATCH[i],WATCH[i-1]]; }],
       ["↓", () => { if (i<WATCH.length-1) [WATCH[i+1],WATCH[i]]=[WATCH[i],WATCH[i+1]]; }],
       ["✕", () => { if (WATCH.length>1) WATCH.splice(i,1); }]].forEach(([label,fn]) => {
        const b = document.createElement("button");
        b.textContent = label;
        b.onclick = () => { fn(); drawModal(); };
        ops.appendChild(b);
      });
      li.appendChild(ops);
      ul.appendChild(li);
    });
  }
  function openModal() { drawModal(); modal.classList.add("open"); }
  function closeModal() { modal.classList.remove("open"); refreshAll(); }
  document.getElementById("addBtn").onclick = () => {
    let v = document.getElementById("addSym").value.trim().toUpperCase();
    if (!v) return;
    if (!v.includes(":")) v = "NASDAQ:" + v;
    if (WATCH.some(([s]) => s.split(":").pop() === v.split(":").pop())) return;
    const n = document.getElementById("addName").value.trim() || v.split(":").pop();
    WATCH.push([v, n]);
    document.getElementById("addSym").value = "";
    document.getElementById("addName").value = "";
    drawModal();
  };
  document.getElementById("resetBtn").onclick = () => { WATCH = DEFAULT.slice(); drawModal(); };
  document.getElementById("doneBtn").onclick = closeModal;
  modal.onclick = e => { if (e.target === modal) closeModal(); };
  form.onsubmit = e => {
    e.preventDefault();
    const v = document.getElementById("sym").value.trim().toUpperCase();
    if (v) show(v);
  };

  function tick() {
    const opt = { hour:"2-digit", minute:"2-digit", second:"2-digit", hour12:false };
    const bj = new Date().toLocaleTimeString("zh-CN", Object.assign({timeZone:"Asia/Shanghai"}, opt));
    const ny = new Date().toLocaleTimeString("zh-CN", Object.assign({timeZone:"America/New_York"}, opt));
    document.getElementById("clock").textContent = "北京 " + bj + " ｜ 纽约 " + ny;
  }
  tick(); setInterval(tick, 1000);

  drawLists();
  drawButtons();
  show(WATCH[0][0]);
</script>
</body>
</html>
